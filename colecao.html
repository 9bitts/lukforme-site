<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luk for Me</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="/oculos-de-sol">
  <script src="js/catalog-data.js?v=9"></script>
  <script>
    (function () {
      var catalog = window.LUK_CATALOG || [];
      var params = new URLSearchParams(location.search);
      var modelo = (params.get("modelo") || "").toLowerCase();
      var grupo = params.get("grupo") || "";
      var section = "sol";
      function sectionOf(product) {
        var category = product.category || "";
        if (category === "Solar") return "sol";
        if (/clip/i.test(category) || product.group === "Clip-on") return "acessorios";
        return "grau";
      }
      if (modelo) {
        var product = catalog.find(function (item) {
          return String(item.code).toLowerCase() === modelo;
        });
        if (product) section = sectionOf(product);
      } else if (grupo === "Clip-on") {
        section = "acessorios";
      } else if (grupo === "Flex 360°") {
        section = "grau";
      }
      var paths = {
        sol: "/oculos-de-sol",
        grau: "/oculos-de-grau",
        acessorios: "/acessorios"
      };
      location.replace(paths[section] + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p><a href="/oculos-de-sol">Óculos de sol</a> · <a href="/oculos-de-grau">Óculos de grau</a> · <a href="/acessorios">Acessórios</a></p>
</body>
</html>
